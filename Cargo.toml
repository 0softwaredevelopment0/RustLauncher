[package]
name = "rustlauncher"
version = "0.2.0"
edition = "2021"
description = "RustLauncher - a fast Minecraft launcher with GUI, rewritten in Rust (successor of the Java PowerLaunch)"
license = "AGPL-3.0"
authors = ["rizer01"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
eframe = "0.29"
egui = "0.29"
rfd = "0.15"
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
chrono = "0.4"
sha1 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
